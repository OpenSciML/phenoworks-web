<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">PhenoWorks Docker Compose Architecture</title>
  <desc id="desc">Architecture diagram for the PhenoWorks Docker Compose stack, showing UI, API, Celery worker, RabbitMQ, PostGIS, tusd uploads, pgAdmin, and shared volumes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="1" stop-color="#eef3f0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20322f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38675f"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#87928f"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #142522; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5f5a; }
      .section { font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26443f; letter-spacing: 0; }
      .label { font: 700 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b27; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #42534f; }
      .tiny { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #62716d; }
      .port { font: 700 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24564f; }
      .box { fill: #ffffff; stroke: #d7e0dd; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .box-soft { fill: #fbfdfc; stroke: #d7e0dd; stroke-width: 1.3; rx: 8; }
      .box-accent { fill: #f2faf7; stroke: #70aaa0; stroke-width: 1.6; rx: 8; filter: url(#shadow); }
      .volume { fill: #fff8ee; stroke: #d9b46c; stroke-width: 1.4; rx: 8; }
      .external { fill: #eef6f8; stroke: #97bcc3; stroke-width: 1.4; rx: 8; }
      .arrow { fill: none; stroke: #38675f; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-muted { fill: none; stroke: #87928f; stroke-width: 2; marker-end: url(#arrow-muted); stroke-dasharray: 8 7; }
      .network { fill: #ffffff; fill-opacity: 0.72; stroke: #c8d7d3; stroke-width: 1.5; rx: 12; }
      .badge { fill: #def0eb; stroke: #9fc8bf; stroke-width: 1; rx: 6; }
      .badge-warn { fill: #fff1d5; stroke: #dfbd78; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>

  <text x="70" y="68" class="title">PhenoWorks Docker Compose Architecture</text>
  <text x="70" y="99" class="subtitle">Current service topology with the external Celery worker added to the API, storage, database, and upload flow.</text>

  <rect x="58" y="132" width="1324" height="622" class="network"/>
  <text x="84" y="166" class="section">Docker Compose network</text>

  <rect x="86" y="210" width="230" height="118" class="external"/>
  <text x="112" y="248" class="label">Browser</text>
  <text x="112" y="277" class="small">User workspace, auth, editor, uploads</text>
  <rect x="112" y="292" width="88" height="26" class="badge"/>
  <text x="124" y="310" class="port">host :3000</text>

  <rect x="392" y="188" width="268" height="150" class="box-accent"/>
  <text x="422" y="226" class="label">ui</text>
  <text x="422" y="256" class="small">Next.js App Router</text>
  <text x="422" y="282" class="tiny">Browser API base: /api/backend</text>
  <text x="422" y="304" class="tiny">Server API base: http://api:9000/api</text>
  <rect x="422" y="318" width="102" height="26" class="badge"/>
  <text x="435" y="336" class="port">3000:3000</text>

  <rect x="735" y="188" width="276" height="150" class="box-accent"/>
  <text x="765" y="226" class="label">api</text>
  <text x="765" y="256" class="small">FastAPI phenoworks.main:app</text>
  <text x="765" y="282" class="tiny">Creates records, auth, hooks, operations</text>
  <text x="765" y="304" class="tiny">Queue backend: celery</text>
  <rect x="765" y="318" width="102" height="26" class="badge"/>
  <text x="778" y="336" class="port">9000:9000</text>

  <rect x="1070" y="188" width="236" height="150" class="box"/>
  <text x="1100" y="226" class="label">tusd</text>
  <text x="1100" y="256" class="small">Resumable upload service</text>
  <text x="1100" y="282" class="tiny">Stores upload chunks in /data</text>
  <text x="1100" y="304" class="tiny">pre-create hook -> api</text>
  <rect x="1100" y="318" width="102" height="26" class="badge"/>
  <text x="1113" y="336" class="port">1080:1080</text>

  <rect x="735" y="420" width="276" height="158" class="box-accent"/>
  <text x="765" y="458" class="label">worker</text>
  <text x="765" y="488" class="small">Celery operation worker</text>
  <text x="765" y="514" class="tiny">uv run celery -A phenoworks.workers...</text>
  <text x="765" y="536" class="tiny">Consumes queue phenoworks</text>
  <rect x="765" y="552" width="148" height="26" class="badge-warn"/>
  <text x="779" y="570" class="port">new service boundary</text>

  <rect x="392" y="420" width="268" height="158" class="box"/>
  <text x="422" y="458" class="label">rabbitmq</text>
  <text x="422" y="488" class="small">Broker for operation tasks</text>
  <text x="422" y="514" class="tiny">Task: phenoworks.run_operation</text>
  <text x="422" y="536" class="tiny">Default queue: phenoworks</text>
  <rect x="422" y="552" width="102" height="26" class="badge"/>
  <text x="435" y="570" class="port">5672:5672</text>
  <rect x="532" y="552" width="116" height="26" class="badge"/>
  <text x="545" y="570" class="port">15672:15672</text>

  <rect x="1070" y="420" width="236" height="158" class="box"/>
  <text x="1100" y="458" class="label">db</text>
  <text x="1100" y="488" class="small">PostGIS PostgreSQL</text>
  <text x="1100" y="514" class="tiny">Metadata, users, studies, operations</text>
  <text x="1100" y="536" class="tiny">Host maps 5433 -> 5432</text>
  <rect x="1100" y="552" width="102" height="26" class="badge"/>
  <text x="1113" y="570" class="port">5433:5432</text>

  <rect x="1070" y="622" width="236" height="90" class="box-soft"/>
  <text x="1100" y="658" class="label">pgadmin</text>
  <text x="1100" y="686" class="small">Database administration UI</text>
  <rect x="1100" y="700" width="94" height="26" class="badge"/>
  <text x="1114" y="718" class="port">5050:80</text>

  <rect x="86" y="632" width="1218" height="86" class="volume"/>
  <text x="116" y="670" class="label">Persistent volumes and mounted data</text>
  <text x="116" y="699" class="small">phenoworks-data -> /var/lib/phenoworks for API and worker; phenoworks-postgres, phenoworks-rabbitmq, phenoworks-pgadmin hold service state; tusd writes chunks under /var/lib/phenoworks/.tusd.</text>

  <path d="M316 269 C345 269 358 263 392 263" class="arrow"/>
  <text x="326" y="250" class="tiny">open app</text>

  <path d="M660 263 C692 263 703 263 735 263" class="arrow"/>
  <text x="666" y="244" class="tiny">SSR and API calls</text>

  <path d="M1011 260 C1038 260 1046 260 1070 260" class="arrow-muted"/>
  <text x="1014" y="244" class="tiny">upload requests</text>

  <path d="M1070 300 C1038 362 1028 390 1001 455" class="arrow-muted"/>
  <text x="1024" y="370" class="tiny">hook callback</text>

  <path d="M735 322 C682 381 668 420 660 476" class="arrow"/>
  <text x="663" y="391" class="tiny">send task</text>

  <path d="M660 500 C694 500 704 500 735 500" class="arrow"/>
  <text x="675" y="484" class="tiny">consume</text>

  <path d="M1011 500 C1034 500 1047 500 1070 500" class="arrow"/>
  <text x="1017" y="484" class="tiny">read/write state</text>

  <path d="M1011 275 C1042 313 1053 365 1070 470" class="arrow"/>
  <text x="1048" y="407" class="tiny">metadata</text>

  <path d="M873 338 L873 420" class="arrow-muted"/>
  <text x="890" y="386" class="tiny">shared code image</text>

  <path d="M873 578 C873 608 836 625 748 632" class="arrow"/>
  <text x="889" y="612" class="tiny">artifacts, logs, uploads</text>

  <path d="M873 338 C856 610 770 624 650 632" class="arrow"/>
  <text x="666" y="618" class="tiny">assets and downloads</text>

  <path d="M1188 578 L1188 622" class="arrow-muted"/>
  <text x="1205" y="606" class="tiny">admin access</text>

  <rect x="70" y="786" width="398" height="66" class="box-soft"/>
  <text x="94" y="816" class="section">Production compose</text>
  <text x="94" y="840" class="small">Builds API/UI images, uses named volumes, disables embedded worker.</text>

  <rect x="522" y="786" width="398" height="66" class="box-soft"/>
  <text x="546" y="816" class="section">Development compose</text>
  <text x="546" y="840" class="small">Bind mounts repo and sibling packages, runs uv sync, enables hot reload.</text>

  <rect x="974" y="786" width="398" height="66" class="box-soft"/>
  <text x="998" y="816" class="section">Operation flow</text>
  <text x="998" y="840" class="small">API persists operations; worker claims and executes them asynchronously.</text>
</svg>
