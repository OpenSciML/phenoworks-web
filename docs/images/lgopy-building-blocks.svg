<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">PhenoWorks crop-agnostic configuration and LgoPy modular analysis extensibility</title>
  <desc id="desc">Diagram showing PhenoWorks as a crop-agnostic research platform customized by JSON config and extended with reusable LgoPy analysis modules.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #d6dee8; stroke-width: 2; rx: 18; }
      .title { font: 700 28px Arial, sans-serif; fill: #12202f; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #536272; }
      .label { font: 700 18px Arial, sans-serif; fill: #152536; }
      .body { font: 400 15px Arial, sans-serif; fill: #4b5b6c; }
      .small { font: 700 13px Arial, sans-serif; fill: #25384c; }
      .arrow { stroke: #52677c; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .config { fill: #e8f3ff; stroke: #5c93c8; stroke-width: 2; }
      .app { fill: #eaf7f0; stroke: #3f9b70; stroke-width: 2; }
      .block1 { fill: #ffd166; stroke: #b8871c; stroke-width: 2; }
      .block2 { fill: #8ecae6; stroke: #357ca1; stroke-width: 2; }
      .block3 { fill: #f4978e; stroke: #b64d45; stroke-width: 2; }
      .block4 { fill: #b8e986; stroke: #5d9b35; stroke-width: 2; }
      .output { fill: #f2ecff; stroke: #8867c8; stroke-width: 2; }
      .stud { fill: rgba(255,255,255,.42); stroke: rgba(18,32,47,.22); stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#52677c"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="620"/>
  <text x="48" y="58" class="title">PhenoWorks: one crop-agnostic research platform, many configured workspaces</text>
  <text x="48" y="88" class="subtitle">Configure title and theme in JSON. Extend phenotyping methods with reusable LgoPy analysis modules.</text>

  <rect x="48" y="128" width="300" height="370" class="panel"/>
  <text x="78" y="170" class="label">1. Reuse the platform</text>
  <text x="78" y="202" class="body">The same browser UI, API,</text>
  <text x="78" y="224" class="body">database model, and job runner</text>
  <text x="78" y="246" class="body">work across crops.</text>
  <rect x="82" y="286" width="220" height="112" class="app" rx="14"/>
  <text x="112" y="330" class="label">PhenoWorks</text>
  <text x="112" y="358" class="body">web platform</text>
  <text x="112" y="382" class="body">crop-agnostic core</text>

  <rect x="410" y="128" width="300" height="370" class="panel"/>
  <text x="440" y="170" class="label">2. Configure deployment</text>
  <text x="440" y="202" class="body">Only the public config needs</text>
  <text x="440" y="224" class="body">to change for a crop-specific</text>
  <text x="440" y="246" class="body">title, subtitle, logo, and theme.</text>
  <rect x="450" y="286" width="220" height="112" class="config" rx="14"/>
  <text x="476" y="324" class="small">{ "title": "PhenoWorks" }</text>
  <text x="476" y="352" class="small">{ "theme": { ... } }</text>
  <text x="476" y="380" class="small">phenoworks.config.json</text>

  <rect x="772" y="128" width="300" height="370" class="panel"/>
  <text x="802" y="170" class="label">3. Add analysis modules</text>
  <text x="802" y="202" class="body">LgoPy modules provide</text>
  <text x="802" y="224" class="body">reusable method units:</text>
  <text x="802" y="246" class="body">install, search, combine, run.</text>

  <g transform="translate(800 286)">
    <rect x="0" y="52" width="108" height="52" class="block1" rx="8"/>
    <circle cx="28" cy="52" r="9" class="stud"/>
    <circle cx="78" cy="52" r="9" class="stud"/>
    <text x="18" y="84" class="small">NDVI</text>
    <rect x="86" y="0" width="108" height="52" class="block2" rx="8"/>
    <circle cx="114" cy="0" r="9" class="stud"/>
    <circle cx="164" cy="0" r="9" class="stud"/>
    <text x="106" y="32" class="small">EVI</text>
    <rect x="86" y="104" width="108" height="52" class="block3" rx="8"/>
    <circle cx="114" cy="104" r="9" class="stud"/>
    <circle cx="164" cy="104" r="9" class="stud"/>
    <text x="104" y="136" class="small">Custom</text>
    <rect x="172" y="52" width="108" height="52" class="block4" rx="8"/>
    <circle cx="200" cy="52" r="9" class="stud"/>
    <circle cx="250" cy="52" r="9" class="stud"/>
    <text x="194" y="84" class="small">Export</text>
  </g>

  <path d="M350 314 C378 314 382 314 408 314" class="arrow"/>
  <path d="M712 314 C740 314 744 314 770 314" class="arrow"/>

  <rect x="242" y="528" width="636" height="54" class="output" rx="16"/>
  <text x="283" y="562" class="label">Result: one platform per research program, extended by reusable analytical modules</text>
</svg>
